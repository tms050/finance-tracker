[project]
name = "finance-tracker"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]